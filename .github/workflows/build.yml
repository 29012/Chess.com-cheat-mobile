name: Build ChessCoach APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -q ChessCoach_Android_Source.zip -d unpacked

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Build APK
        working-directory: unpacked/ChessCoach_Android_Source
        run: gradle :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ChessCoach-APK
          path: unpacked/ChessCoach_Android_Source/app/build/outputs/apk/debug/app-debug.apk
